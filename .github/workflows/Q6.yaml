name: Exercice 6
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
permissions:
  contents: write
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥 The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."
      - name: workflow6
        run: |
          DATE_STAMP=$(date +'%d-%m-%Y-%H%M%S')
          ARCHIVE_NOM="Q6_archive_${DATE_STAMP}.txt"
          PREV_ARCHIVE=$(ls -1 Q6_archive_*.txt 2>/dev/null | sort | tail -n 1 || true)

          {
            echo "Timothe Magne"
            echo ""
            cat Q6.java
            echo ""
            wc -l -c Q6.java
          } > "$ARCHIVE_NOM"

          {
            echo "Comparaison entre le fichier précédent et le nouveau fichier :"
            echo "Précédent : ${PREV_ARCHIVE:-aucun}"
            echo "Nouveau   : $ARCHIVE_NOM"
            echo ""
            if [ -n "$PREV_ARCHIVE" ]; then
              diff -u "$PREV_ARCHIVE" "$ARCHIVE_NOM" || true
            else
              echo "premier fichier"
            fi
          } > "Q6_différences.txt"

          echo "ARCHIVE_NOM=$ARCHIVE_NOM" >> "$GITHUB_ENV"

      - name: XXX commmit et push
        run: |
          git config --global user.name Timothe-Magne
          git config --global user.email timothe.magne@gmail.com
          git add "$ARCHIVE_NOM" "Q6_différences.txt"
          git commit -m "ajoutde $ARCHIVE_NOM et Q6_différences.txt"
          git push
